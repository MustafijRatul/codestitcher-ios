<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No internet</title>
    <link rel="stylesheet" href="index.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        html, body {
            background-color: #202124 !important;
            color: #e8eaed !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Invert Canvas for authentic Chrome Dark Mode */
        .runner-canvas {
            filter: invert(1);
        }

        .icon-offline {
            filter: invert(1);
        }

        .interstitial-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 24px 0 24px;
            box-sizing: border-box;
        }

        h1 {
            color: #e8eaed !important;
            font-size: 24px;
            font-weight: 500;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        p, li {
            color: #9aa0a6 !important;
            font-size: 15px;
            line-height: 1.6;
        }

        ul {
            padding-left: 20px;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .error-code {
            color: #5f6368 !important;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Subtle Reconnect Button at the bottom */
        .reconnect-bar {
            position: fixed;
            bottom: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .reconnect-btn {
            background-color: #303134;
            color: #8ab4f8;
            border: 1px solid #3c4043;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reconnect-btn:active {
            background-color: #3c4043;
        }
    </style>
</head>
