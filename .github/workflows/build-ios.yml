name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project CodeStitcher.xcodeproj \
                     -scheme CodeStitcher \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -archivePath ./build/CodeStitcher.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/CodeStitcher.xcarchive/Products/Applications/CodeStitcher.app Payload/
          zip -qr CodeStitcher.ipa Payload
          echo "IPA created successfully:"
          ls -lh CodeStitcher.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeStitcher-iOS-IPA
          path: CodeStitcher.ipa
          retention-days: 30
